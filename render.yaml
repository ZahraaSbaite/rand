databases:
  - name: crochet-shop-db
    plan: free
    databaseName: crochet_shop
    user: crochet_shop

services:
  - type: web
    name: crochet-shop
    runtime: node
    # Root is the repo root (not backend/) because this single service
    # builds the frontend too and has the backend serve its dist/ output.
    # Disks require a paid instance plan - Render's free web service plan
    # cannot attach a persistent disk, so uploaded images would be wiped
    # on every deploy/restart on the free plan.
    plan: starter
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: crochet-shop-db
          property: connectionString
      - key: UPLOADS_DIR
        value: /var/data/uploads
      # Empty so the frontend calls the API via relative paths - it's the
      # same origin as the backend now, since one service serves both.
      - key: VITE_API_URL
        value: ""
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
